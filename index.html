<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IV Unidad | Presentaciones</title>
<style>
:root{
 --bg:#030b18;--panel:#071a31;--panel2:#0a2340;--cyan:#00eaff;
 --yellow:#ffe500;--text:#effaff;--muted:#9db7ca;--line:#134564;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;color:var(--text);
 background:
 radial-gradient(circle at 15% 20%,#00d9ff18 0 2px,transparent 3px),
 radial-gradient(circle at 80% 30%,#00eaff12 0 2px,transparent 3px),
 linear-gradient(135deg,#020815,#061c34 50%,#020916);
 background-attachment:fixed}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.18;
 background-image:linear-gradient(90deg,transparent 49%,#00eaff 50%,transparent 51%),
 linear-gradient(0deg,transparent 49%,#00eaff 50%,transparent 51%);
 background-size:120px 120px}
header{position:relative;padding:42px 20px 30px;text-align:center;border-bottom:1px solid #0c4668;
 background:linear-gradient(180deg,#061d38dd,#061327cc);box-shadow:0 0 35px #00eaff18}
.logo{font-size:52px;filter:drop-shadow(0 0 12px #00eaff)}
h1{margin:8px 0 4px;font-size:clamp(28px,5vw,48px);letter-spacing:2px;color:var(--yellow);
 text-shadow:0 0 14px #ffe50044}
.subtitle{color:var(--cyan);font-weight:bold;letter-spacing:3px}
main{position:relative;max-width:1250px;margin:25px auto;padding:0 18px}
.panel{background:linear-gradient(145deg,#071a31ee,#0a2038ee);border:1px solid var(--line);
 border-radius:18px;padding:20px;box-shadow:0 10px 35px #0008,0 0 25px #00eaff0c;margin-bottom:18px}
.panel-title{display:flex;align-items:center;gap:10px;margin:0 0 15px;color:#fff}
.day-buttons{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
button{font:inherit;cursor:pointer;border:1px solid #1c5975;background:#0a2844;color:#dff8ff;
 border-radius:12px;padding:14px 10px;font-weight:bold;transition:.2s}
button:hover{transform:translateY(-2px);border-color:var(--cyan);box-shadow:0 0 18px #00eaff25}
button.active{background:var(--yellow);color:#06162b;border-color:var(--yellow);box-shadow:0 0 20px #ffe50055}
.time-buttons{display:flex;flex-wrap:wrap;gap:9px}
.time-buttons button{padding:10px 13px;font-size:14px}
.schedule{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:15px}
.card{position:relative;overflow:hidden;background:linear-gradient(145deg,#0a2340,#061a31);
 border:1px solid #165274;border-radius:16px;padding:19px;min-height:185px;
 box-shadow:0 8px 25px #0007;transition:.2s}
.card:hover{transform:translateY(-4px);border-color:var(--cyan);box-shadow:0 10px 30px #00eaff1e}
.card .glow{position:absolute;width:120px;height:120px;border-radius:50%;right:-45px;top:-45px;
 background:#00eaff16;filter:blur(5px)}
.icon{font-size:35px}.time{color:var(--yellow);font-weight:bold;font-size:14px;letter-spacing:1px}
.title{font-size:20px;font-weight:bold;margin:10px 0 7px}.meta{color:var(--muted);font-size:13px;min-height:34px}
.open{display:inline-block;margin-top:15px;text-decoration:none;background:var(--yellow);color:#06162b;
 font-weight:bold;padding:10px 14px;border-radius:9px;box-shadow:0 0 15px #ffe50020}
.empty{text-align:center;color:var(--muted);padding:40px}
.legend{display:flex;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:13px}
.badge{border:1px solid #1c5975;padding:5px 9px;border-radius:20px}
footer{text-align:center;padding:30px;color:#7795aa;font-size:13px}
@media(max-width:800px){.day-buttons{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>

<section id="schedule" class="schedule"></section>

const dayNames={LUNES:"Lunes",MARTES:"Martes",MIERCOLES:"Miércoles",JUEVES:"Jueves",VIERNES:"Viernes"};
const dayOrder=["LUNES","MARTES","MIERCOLES","JUEVES","VIERNES"];
let selectedDay="LUNES", selectedTime="TODAS";
const daysEl=document.getElementById("days"), timesEl=document.getElementById("times"), scheduleEl=document.getElementById("schedule");
function renderDays(){
 daysEl.innerHTML=dayOrder.map(d=>`<button class="${d===selectedDay?'active':''}" onclick="setDay('${d}')">${dayNames[d]}</button>`).join("");
}
function renderTimes(){
 const list=classes.filter(c=>c.day===selectedDay);
 const times=[...new Map(list.map(c=>[c.time,`${c.start} - ${c.end}`]))];
 timesEl.innerHTML=`<button class="${selectedTime==='TODAS'?'active':''}" onclick="setTime('TODAS')">TODAS</button>`+
 times.map(([t,label])=>`<button class="${t===selectedTime?'active':''}" onclick="setTime('${t}')">${label}</button>`).join("");
}
function renderCards(){
 let list=classes.filter(c=>c.day===selectedDay && (selectedTime==='TODAS'||c.time===selectedTime));
 document.getElementById("sectionTitle").textContent=`📚 ${dayNames[selectedDay]} · ${selectedTime==='TODAS'?'Todas las clases':list[0]?.start+' - '+list[0]?.end}`;
 scheduleEl.innerHTML=list.length?list.map(c=>`
 <article class="card"><div class="glow"></div><div class="icon">${c.icon}</div>
 <div class="time">${c.start} - ${c.end}</div><div class="title">${c.title}</div>
 <div class="meta">IV Unidad · ${dayNames[c.day]}</div>
 <a class="open" href="${c.href}">▶ Abrir clase</a></article>`).join(""):`<div class="empty">No hay una clase en ese horario.</div>`;
}
function setDay(d){selectedDay=d;selectedTime="TODAS";renderAll()}
function setTime(t){selectedTime=t;renderTimes();renderCards()}
function renderAll(){renderDays();renderTimes();renderCards()}
